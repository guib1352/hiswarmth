<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>남의 온도 — 인터랙티브 폰 테스트</title>
<style>
*{box-sizing:border-box}
:root{
  --ink:#111;
  --sub:#8c8c92;
  --line:#ececef;
  --talk:#ffd86b;
  --pix:#765fc5;
  --blue:#3478f6;
  --green:#34c759;
}
html,body{
  margin:0;min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",sans-serif;
  background:#cfcfd2;color:var(--ink)
}
body{display:grid;place-items:center;padding:12px}
button,input{font:inherit}
button{cursor:pointer}
.phone{
  width:min(390px,100%);
  aspect-ratio:390/844;
  max-height:calc(100vh - 24px);
  border-radius:42px;background:#101010;padding:9px;
  box-shadow:0 24px 70px rgba(0,0,0,.3)
}
.screen{
  height:100%;border-radius:34px;overflow:hidden;position:relative;background:#111
}
.wallpaper{
  position:absolute;inset:0;
  background:
    radial-gradient(circle at 75% 18%,rgba(255,255,255,.24),transparent 21%),
    radial-gradient(circle at 22% 68%,rgba(255,255,255,.12),transparent 27%),
    linear-gradient(160deg,#586275 0%,#29313d 45%,#161b22 100%)
}
.wallpaper:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(0,0,0,.17))}
.island{
  position:absolute;z-index:90;top:10px;left:50%;transform:translateX(-50%);
  width:102px;height:28px;border-radius:18px;background:#080808
}
.status{
  position:absolute;z-index:80;left:0;right:0;top:0;height:48px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;color:white;font-size:12px;font-weight:700;pointer-events:none
}
.home{
  position:absolute;inset:0;z-index:5;padding:62px 14px 26px;
  display:flex;flex-direction:column;color:white
}
.clock{text-align:center;margin:5px 0 21px;text-shadow:0 1px 8px rgba(0,0,0,.18)}
.clock .time{
  font-size:66px;
  font-weight:250;
  letter-spacing:-3px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center
}
.clock .time .clock-colon{
  display:inline-block;
  line-height:1;
  transform:translateY(-2px);
  margin:0 1px;
  letter-spacing:-2px
}
.clock .date{font-size:14px;margin-top:7px;font-weight:600}
.notifications{display:grid;gap:9px}
.notification{
  width:100%;border:0;color:white;background:rgba(30,30,34,.58);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:18px;padding:11px 12px 12px;text-align:left;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 7px 25px rgba(0,0,0,.08)
}
.nhead{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.talk-mini{
  width:24px;height:24px;border-radius:8px;background:var(--talk);color:#3a2b00;
  display:grid;place-items:center;font-size:12px;font-weight:900
}
.appname{font-size:11px;font-weight:750;flex:1;color:rgba(255,255,255,.84)}
.now{font-size:10px;color:rgba(255,255,255,.6)}
.sender{font-size:13px;font-weight:800;margin-bottom:2px}
.ntext{font-size:13px;line-height:1.35}
.icons{
  margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);
  gap:16px 13px;padding:8px 5px 4px
}
.appicon{
  border:0;background:transparent;color:white;padding:0;
  display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;
  text-shadow:0 1px 4px rgba(0,0,0,.35)
}
.appbox{
  width:54px;height:54px;border-radius:14px;display:grid;place-items:center;
  box-shadow:0 5px 14px rgba(0,0,0,.12);font-size:24px;text-shadow:none;font-weight:750
}
.talk-app{background:var(--talk);color:#3a2b00}
.pix-app{color:white;background:linear-gradient(135deg,#5d6fd3,#8c5cc7 52%,#d46f92)}
.notes-app{background:white;color:#e5b500}
.camera-app{background:#d9d9de;color:#222}
.dock{
  margin:16px 4px 0;padding:10px 14px;border-radius:24px;
  background:rgba(255,255,255,.16);backdrop-filter:blur(18px);
  display:flex;justify-content:space-around
}
.dock button{border:0;background:transparent;padding:0}
.dock .appbox{width:48px;height:48px;border-radius:13px}
.phone-icon{background:#58c768;color:#fff}
.sms-icon{background:#5a9cff;color:#fff}
.browser-icon{background:#fff;color:#1591ff}
.music-icon{background:#fff;color:#4075f4}

.view{
  position:absolute;inset:0;z-index:50;background:#fff;color:#111;
  display:none;overflow:auto;padding-top:48px
}
.view.active{display:block}
.app-header{
  position:sticky;top:-48px;z-index:10;height:58px;
  display:grid;grid-template-columns:44px 1fr 44px;align-items:center;
  padding:0 8px;border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.97);backdrop-filter:blur(10px)
}
.app-header h1{font-size:16px;text-align:center;margin:0}
.back,.home-btn{
  border:0;background:transparent;color:#666;height:44px
}
.back{font-size:28px;text-align:left;padding:0 8px}
.home-btn{font-size:18px}
.section-title{font-size:28px;font-weight:800;letter-spacing:-1px;margin:20px 16px 8px}
.soft-search{
  margin:0 14px 10px;height:36px;border-radius:10px;background:#f1f1f4;
  display:flex;align-items:center;padding:0 11px;color:#9a9aa0;font-size:13px
}


.secret-reply{
  display:flex;
  align-items:flex-start;
  gap:8px;
  margin:10px 0;
}
.secret-reply .chat-content{
  max-width:82%;
}
.secret-links{
  display:grid;
  gap:7px;
  margin-top:7px;
}

/* TalkTalk */
.talk-list{padding:4px 12px 18px}
.chat-card{
  width:100%;border:0;background:#fff;display:grid;
  grid-template-columns:50px 1fr auto;gap:11px;text-align:left;
  padding:12px 4px;border-bottom:1px solid #f2f2f3
}
.avatar,.person-avatar{
  border-radius:18px;background:linear-gradient(135deg,#777d89,#30343c);
  color:#fff;display:grid;place-items:center;font-weight:800
}
.avatar{width:50px;height:50px}
.chat-name{font-size:14px;font-weight:800;margin-bottom:4px}
.chat-preview{font-size:12px;color:#777;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-meta{text-align:right;font-size:10px;color:#aaa;padding-top:2px}
.unread{margin:7px 0 0 auto;width:18px;height:18px;border-radius:50%;background:#ff3b30;color:white;display:grid;place-items:center;font-size:10px}

.chat-room{background:#b2c7d9;overflow:hidden}
.chat-room .app-header{background:#b2c7d9;border-color:rgba(0,0,0,.06)}
.room-shell{height:calc(100% - 58px);display:flex;flex-direction:column}
.chat-scroll{flex:1;overflow:auto;padding:15px 12px 10px}
.datechip{margin:0 auto 16px;width:max-content;padding:5px 9px;border-radius:12px;font-size:10px;background:rgba(0,0,0,.14);color:white}
.chat-row{display:flex;align-items:flex-start;gap:8px;margin:10px 0}
.chat-row.mine{justify-content:flex-end}
.room-avatar{width:38px;height:38px;border-radius:14px;flex:none}
.chat-content{max-width:78%}
.chat-sender{font-size:11px;color:#3e4851;margin:0 0 4px 2px}
.bubble{background:#fff;padding:9px 11px;border-radius:13px;font-size:13px;line-height:1.5;box-shadow:0 1px 1px rgba(0,0,0,.04)}
.mine .bubble{background:#fff29a}
.link-stack{display:grid;gap:7px;margin-top:9px}
.pix-link{
  border:0;width:100%;background:#fff;border-radius:12px;padding:8px;
  display:flex;align-items:center;gap:9px;text-align:left;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.07)
}
.link-avatar{width:38px;height:38px;border-radius:50%;background:var(--g);flex:none}
.link-copy{min-width:0;flex:1}
.link-id{display:block;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-sub{display:block;font-size:10px;color:#888;margin-top:2px}
.link-arrow{color:#aaa;font-size:18px}
.composer{padding:8px 9px 13px;background:rgba(255,255,255,.7);display:grid;grid-template-columns:1fr 42px;gap:7px}
.composer input{border:0;outline:0;border-radius:20px;padding:0 13px;height:38px;background:#fff;font-size:13px}
.send-btn{border:0;border-radius:50%;background:var(--talk);height:38px;width:38px;font-weight:800}

/* Phone */
.phone-tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
.phone-tabs button{border:0;background:#fff;padding:9px 4px 12px;color:#888;font-size:10px}
.phone-tabs button.active{color:var(--blue);font-weight:800}
.phone-tab{display:none;padding-bottom:12px}.phone-tab.active{display:block}
.contact-row{
  width:100%;border:0;background:#fff;display:flex;align-items:center;gap:11px;
  padding:11px 16px;text-align:left;border-bottom:1px solid #f3f3f4
}
.person-avatar{width:44px;height:44px;border-radius:50%}
.contact-main{flex:1;min-width:0}.contact-main b{font-size:13px}.contact-main span{display:block;color:#888;font-size:11px;margin-top:2px}
.call-small{font-size:21px;color:var(--blue)}
.keypad-number{height:78px;display:grid;place-items:end center;padding-bottom:7px;font-size:26px;letter-spacing:.5px}
.keypad{width:246px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px}
.key{border:0;width:60px;height:60px;border-radius:50%;background:#e9e9ec;font-size:24px;margin:auto}
.key small{display:block;font-size:8px;letter-spacing:1px}
.call-key{background:var(--green);color:#fff;font-size:25px}
.delete-key{background:#fff;font-size:18px}
.call-screen{
  background:linear-gradient(180deg,#59616d,#1d2228);color:#fff;text-align:center;overflow:hidden
}
.calling{padding:100px 20px 0}
.calling-avatar{width:92px;height:92px;border-radius:50%;margin:0 auto 18px;background:linear-gradient(135deg,#969ca6,#393e46);display:grid;place-items:center;font-size:32px;font-weight:800}
.calling h2{margin:0;font-size:26px}.calling p{color:rgba(255,255,255,.7);font-size:13px}
.call-actions{display:flex;justify-content:center;margin-top:140px}
.end-call{border:0;width:66px;height:66px;border-radius:50%;background:#ff3b30;color:white;font-size:28px}

/* SMS */
.sms-list{padding:0 12px}
.sms-row{
  width:100%;border:0;background:#fff;display:grid;grid-template-columns:46px 1fr auto;
  gap:10px;text-align:left;padding:11px 3px;border-bottom:1px solid #f2f2f3
}
.sms-avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#ddd;font-weight:800}
.sms-name{font-size:13px;font-weight:800}.sms-preview{font-size:11px;color:#888;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sms-time{font-size:10px;color:#aaa}
.sms-thread{overflow:hidden}
.thread-shell{height:calc(100% - 58px);display:flex;flex-direction:column}
.thread-scroll{flex:1;overflow:auto;padding:20px 14px}
.sms-bubble{max-width:75%;padding:9px 11px;border-radius:17px;background:#e9e9ec;font-size:13px;line-height:1.4;margin:8px 0}
.sms-bubble.me{margin-left:auto;background:#36c55f;color:#fff}
.sms-compose{padding:8px 9px 13px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 42px;gap:7px}
.sms-compose input{height:38px;border:1px solid #ddd;border-radius:20px;padding:0 13px;outline:0;font-size:13px}
.sms-send{border:0;border-radius:50%;height:38px;width:38px;background:#36c55f;color:white;font-weight:800}


/* Pixsta DM */
.pix-dm-view{
  overflow:hidden;
}
.pix-dm-shell{
  height:calc(100% - 58px);
  display:flex;
  flex-direction:column;
  background:#fff;
}
.pix-dm-profile{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  border-bottom:1px solid #f0f0f2;
}
.pix-dm-avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--g);
  flex:none;
}
.pix-dm-profile b{
  display:block;
  font-size:12px;
}
.pix-dm-profile span{
  display:block;
  margin-top:2px;
  font-size:10px;
  color:#8d8d93;
}
.pix-dm-scroll{
  flex:1;
  overflow:auto;
  padding:16px 12px;
  background:#fff;
}
.pix-dm-bubble{
  width:max-content;
  max-width:76%;
  margin:7px 0;
  padding:9px 11px;
  border-radius:18px;
  background:#efeff2;
  font-size:13px;
  line-height:1.4;
  word-break:break-word;
}
.pix-dm-bubble.me{
  margin-left:auto;
  background:#6c62d9;
  color:#fff;
}
.pix-dm-time{
  text-align:center;
  color:#aaa;
  font-size:9px;
  margin:3px 0 12px;
}
.pix-dm-compose{
  display:grid;
  grid-template-columns:1fr 42px;
  gap:7px;
  padding:8px 9px 13px;
  border-top:1px solid #ececef;
  background:#fff;
}
.pix-dm-compose input{
  height:38px;
  border:1px solid #dddde1;
  border-radius:20px;
  padding:0 13px;
  outline:0;
  font-size:13px;
}
.pix-dm-send{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#6c62d9;
  color:#fff;
  font-weight:800;
}

/* Pixsta */
.pix-home .app-header h1{font-family:Georgia,serif;font-style:italic;font-size:20px}
.account-list{padding:8px 14px 20px}
.account{
  width:100%;border:0;background:#fff;display:flex;align-items:center;gap:11px;
  padding:11px 0;text-align:left;border-bottom:1px solid #f3f3f4
}
.account-avatar{width:52px;height:52px;border-radius:50%;background:var(--g);flex:none}
.account-main{min-width:0}.account-id{font-size:13px;font-weight:800}.account-name{font-size:11px;color:#8a8a8f;margin-top:2px}
.view-btn{margin-left:auto;font-size:11px;font-weight:750;background:#efeff1;border-radius:7px;padding:7px 10px}
.profile{padding:18px 15px 20px}
.profile-top{display:flex;gap:18px;align-items:center}
.profile-avatar{width:82px;height:82px;border-radius:50%;background:var(--g);flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;text-align:center;flex:1}
.stat-btn{border:0;background:transparent;padding:4px 1px;color:#111}
.stat-btn b{display:block;font-size:14px}.stat-btn span{font-size:10px}
.bio{font-size:12px;line-height:1.5;padding:12px 0}.bio b{display:block}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.actions button{border:0;height:34px;border-radius:8px;font-weight:750}
.follow{background:#6c62d9;color:white}.msgbtn{background:#efeff1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:12px -15px 0}
.post{
  aspect-ratio:1;
  background:var(--p);
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  position:relative;
  overflow:hidden;
  border:0;
  padding:0;
  width:100%;
  cursor:pointer;
}
.post:active{opacity:.78}

.post-detail{padding-bottom:24px}
.post-detail-head{
  height:56px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 13px;
  border-bottom:1px solid #f1f1f3
}
.post-detail-avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  background:var(--g);
  flex:none
}
.post-detail-user{min-width:0;flex:1}
.post-detail-user b{
  display:block;
  font-size:12px;
  line-height:1.25
}
.post-detail-user span{
  display:block;
  color:#888;
  font-size:10px;
  margin-top:2px
}
.post-more{
  border:0;
  background:transparent;
  font-weight:800;
  letter-spacing:1px;
  height:44px
}
.post-detail-image{
  width:100%;
  aspect-ratio:1/1;
  background:var(--p);
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  position:relative;
  overflow:hidden
}
.post-detail-image.liked:before{
  content:"♥";
  position:absolute;
  z-index:2;
  inset:0;
  display:grid;
  place-items:center;
  color:#fff;
  font-size:86px;
  text-shadow:0 4px 18px rgba(0,0,0,.28);
  animation:heartPop .55s ease both
}
@keyframes heartPop{
  0%{opacity:0;transform:scale(.45)}
  40%{opacity:1;transform:scale(1.15)}
  100%{opacity:0;transform:scale(1)}
}
.post-detail-actions{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 10px 2px
}
.post-detail-actions button{
  border:0;
  background:transparent;
  width:40px;
  height:40px;
  padding:0;
  font-size:27px;
  line-height:1
}
.post-detail-actions .save-post{margin-left:auto}
.post-detail-actions button.active{font-weight:900;color:#e54755}
.post-detail-copy{
  padding:0 13px;
  font-size:12px;
  line-height:1.55
}
.post-likes{font-weight:800;margin:2px 0 4px}
.post-caption b{margin-right:3px}
.comments-link{
  display:block;
  border:0;
  background:transparent;
  padding:4px 0;
  color:#929298;
  font-size:11px
}
.post-comments{
  margin-top:4px;
}
.post-comment{
  font-size:11px;
  line-height:1.5;
  margin:2px 0;
}
.post-comment b{
  margin-right:4px;
  font-weight:800;
}
.post-date{
  color:#a0a0a6;
  font-size:9px;
  margin-top:5px
}
.social-list{padding:7px 14px}
.social-row.clickable{
  cursor:pointer;
}
.private-note{
  margin:2px 0 12px;
  padding:9px 10px;
  background:#f5f5f7;
  border-radius:9px;
  color:#777;
  font-size:11px;
  font-weight:700;
}
.private-profile .grid{
  margin-top:8px;
}

.social-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid #f4f4f5}
.social-avatar{width:46px;height:46px;border-radius:50%;background:var(--g);flex:none}
.social-copy{flex:1;min-width:0}.social-copy b{display:block;font-size:12px}.social-copy span{font-size:11px;color:#888}
.social-follow{border:0;border-radius:7px;background:#0095f6;color:#fff;padding:7px 10px;font-size:11px;font-weight:750}

.homebar{position:absolute;z-index:100;bottom:6px;left:50%;transform:translateX(-50%);width:120px;height:5px;border-radius:4px;background:rgba(255,255,255,.92)}
.view.active ~ .homebar{background:#111}

.push-notification{
  opacity:0;
  transform:translateY(-18px) scale(.985);
  transition:opacity .34s ease,transform .34s cubic-bezier(.2,.8,.2,1);
  pointer-events:none;
}
.push-notification.show-push{
  opacity:1;
  transform:translateY(0) scale(1);
  pointer-events:auto;
}
.push-notification.hidden-push{
  display:none;
}
.push-notification.dismiss-push{
  opacity:0;
  transform:translateY(-14px) scale(.985);
}
.global-push{
  position:absolute;
  z-index:120;
  left:12px;
  right:12px;
  top:52px;
  border:0;
  color:#fff;
  background:rgba(30,30,34,.82);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border-radius:18px;
  padding:11px 12px 12px;
  text-align:left;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),0 10px 26px rgba(0,0,0,.18);
  opacity:0;
  transform:translateY(-18px) scale(.985);
  pointer-events:none;
  transition:opacity .34s ease,transform .34s cubic-bezier(.2,.8,.2,1);
}
.global-push.show{
  opacity:1;
  transform:translateY(0) scale(1);
  pointer-events:auto;
}
.global-push.hide{
  opacity:0;
  transform:translateY(-16px) scale(.985);
  pointer-events:none;
}
.staged-message{
  animation:messageIn .25s ease both;
}
@keyframes messageIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

@media(max-width:340px){
  .clock .time{font-size:58px}.notifications{gap:7px}.notification{padding:9px 10px}
  .icons{gap:10px}.appbox{width:50px;height:50px}
}
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="wallpaper"></div>

  function normalizeFeedUrl(url){
    let v = String(url || "").trim();
    if(!v) return "";

    const githubBlob = v.match(
      /^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/([^/]+)\/(.+)$/i
    );
    if(githubBlob){
      const [, user, repo, branch, filePath] = githubBlob;
      v = `https://raw.githubusercontent.com/${user}/${repo}/${branch}/${filePath}`;
    }

    return v;
  }

  function parseEditableComment(value){
    const raw = String(value || "").trim();
    if(!raw) return null;

    const divider = raw.indexOf(">");
    if(divider === -1){
      return {user:"user", text:raw};
    }

    const user = raw.slice(0, divider).trim() || "user";
    const text = raw.slice(divider + 1).trim();

    if(!text) return null;
    return {user, text};
  }

  function readEditableFeed(elementId, fallbackPosts, fallbackCaptions, fallbackDates=[], fallbackComments=[]){
    const source = document.getElementById(elementId);

    if(!source){
      return {
        posts:[...fallbackPosts],
        captions:[...fallbackCaptions],
        dates:fallbackPosts.map((_,i) => fallbackDates[i] || "방금 전"),
        comments:fallbackPosts.map((_,i) => fallbackComments[i] || [])
      };
    }

    const rawLines = source.textContent
      .split(/\r?\n/)
      .map(line => line.trim())
      .filter(line => line && !line.startsWith("#"));

    if(rawLines.length === 0){
      return {
        posts:[...fallbackPosts],
        captions:[...fallbackCaptions],
        dates:fallbackPosts.map((_,i) => fallbackDates[i] || "방금 전"),
        comments:fallbackPosts.map((_,i) => fallbackComments[i] || [])
      };

    const posts = [];
    const captions = [];
    const dates = [];
    const comments = [];

    rawLines.slice(0,30).forEach(line => {
      const parts = line.split("|");

      const imagePart = (parts[0] || "").trim();

      const datePart = (parts[2] || "").trim();
      const comment1 = parseEditableComment(parts[3] || "");

        posts.push(normalized);
        captions.push(captionPart);
        dates.push(datePart || "방금 전");
        comments.push([comment1, comment2].filter(Boolean));
      }
    });

  function applyPostVisual(el, value){
    const v = String(value || "").trim();
    const isImage =
      /^https?:\/\//i.test(v) ||
      /^images\//i.test(v) ||
      /^\.\.?\//.test(v) ||
      /\.(png|jpe?g|webp|gif|avif)(\?.*)?$/i.test(v);

    if(isImage){
      const safe = v.replace(/"/g, '\\"');
      el.style.backgroundImage = `url("${safe}")`;
      el.style.backgroundColor = "#ddd";
      el.style.removeProperty("--p");
    }else{
      el.style.backgroundImage = "";
      el.style.setProperty("--p", v || "#ddd");
    }
  }

        <button type="button" class="social-follow">팔로우</button>`;
      row.querySelector("button").addEventListener("click", e => {
        const b=e.currentTarget;
        const on=b.textContent==="팔로잉";
        b.textContent=on?"팔로우":"팔로잉";
        b.style.background=on?"#0095f6":"#efeff1";
        b.style.color=on?"#fff":"#111";
      });
      list.appendChild(row);
    }
    if(mode === "following" && nestedPrivateAccounts[owner]){
      const nested = nestedPrivateAccounts[owner];
      const row = document.createElement("div");
      row.className = "social-row clickable";
      row.innerHTML = `
        <div class="social-avatar" style="--g:${nested.grad}"></div>
        <div class="social-copy"><b>${nested.id}</b><span>${nested.name}</span></div>
        <button type="button" class="social-follow">팔로우</button>`;
      const followBtn = row.querySelector("button");
      followBtn.addEventListener("click", e => {
        e.stopPropagation();
        const on = followBtn.textContent === "팔로잉";
        followBtn.textContent = on ? "팔로우" : "팔로잉";
        followBtn.style.background = on ? "#0095f6" : "#efeff1";
        followBtn.style.color = on ? "#fff" : "#111";
      });
      row.addEventListener("click", () => openNestedProfile(owner, "altFollowing"));
      list.appendChild(row);
    }
    document.getElementById("socialBack").onclick = () => openPrivateProfile(owner);
    show("socialListView");
  }

  function openSocial(mode){
    socialMode = mode;
    document.getElementById("socialBack").onclick = () => show("profileView");
    document.getElementById("socialTitle").textContent = mode === "followers" ? "팔로워" : "팔로잉";
    const list = document.getElementById("socialList");
    list.innerHTML = "";
    const offset = (currentProfile + (mode === "followers" ? 0 : 2)) % socialPool.length;
    const count = mode === "followers" ? 7 : 6;
    for(let i=0;i<count;i++){
      const p = socialPool[(offset+i)%socialPool.length];
      const row=document.createElement("div");
      row.className="social-row";
      row.innerHTML=`
        <div class="social-avatar" style="--g:${p.grad}"></div>
        <div class="social-copy"><b>${p.id}</b><span>${p.name}</span></div>
        <button type="button" class="social-follow">팔로우</button>`;
      row.querySelector("button").addEventListener("click", e => {
        const b=e.currentTarget;
        const on=b.textContent==="팔로잉";
        b.textContent=on?"팔로우":"팔로잉";
        b.style.background=on?"#0095f6":"#efeff1";
        b.style.color=on?"#fff":"#111";
      });
      list.appendChild(row);
    }

    // 서이준/우도준 팔로잉 목록 최하단의 별도 계정
    if(mode === "following" && privateAccounts[currentProfile]){
      const p = privateAccounts[currentProfile];
      const row = document.createElement("div");
      row.className = "social-row clickable";
      row.innerHTML = `
        <div class="social-avatar" style="--g:${p.grad}"></div>
        <div class="social-copy">
          <b>${p.id}</b>
          <span>${p.name}</span>
        </div>
        <button type="button" class="social-follow">팔로우</button>
      `;
      const followBtn = row.querySelector("button");
      followBtn.addEventListener("click", e => {
        e.stopPropagation();
        const on = followBtn.textContent === "팔로잉";
        followBtn.textContent = on ? "팔로우" : "팔로잉";
        followBtn.style.background = on ? "#0095f6" : "#efeff1";
        followBtn.style.color = on ? "#fff" : "#111";
      });
      row.addEventListener("click", () => openPrivateProfile(currentProfile, "mainFollowing"));
      list.appendChild(row);
    }

    show("socialListView");
  }
})();
</script>
</body>
</html>
